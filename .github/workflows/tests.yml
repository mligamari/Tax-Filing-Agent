name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Write and check the Virginia example from scratch
        run: |
          python -m taxfiling w2 --state VA --input examples/va_2026/w2_2026_va_synthetic.xlsx \
            --submitter examples/va_2026/submitter.json --out "/tmp/W2 REPORT 2026.txt"
          cmp "/tmp/W2 REPORT 2026.txt" "examples/va_2026/output/W2 REPORT 2026.txt"
